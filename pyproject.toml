[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gwy-job-radar"
version = "0.1.0"
description = "公务员招考信息监测与提醒"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gwy-job-radar contributors" }]
dependencies = [
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
gwy-job-radar = "gwy_job_radar.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gwy_job_radar"]

[tool.hatch.build.targets.wheel.force-include]
"src/gwy_job_radar" = "gwy_job_radar"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
